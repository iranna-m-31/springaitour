<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="ragGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="#0d1117"/>
  <text x="400" y="40" text-anchor="middle" fill="#e6edf3" font-family="system-ui" font-size="18" font-weight="600">RAG Architecture</text>

  <!-- User Query -->
  <rect x="20" y="80" width="160" height="80" rx="12" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="110" text-anchor="middle" fill="#93c5fd" font-family="system-ui" font-size="13" font-weight="600">User Query</text>
  <text x="100" y="135" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="10">"What is RAG?"</text>

  <!-- Embedding -->
  <path d="M185 120 L230 120" stroke="url(#ragGrad)" stroke-width="3" fill="none"/>
  <rect x="235" y="80" width="180" height="80" rx="12" fill="#134e4a" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="325" y="110" text-anchor="middle" fill="#6ee7b7" font-family="system-ui" font-size="13" font-weight="600">Embedding</text>
  <text x="325" y="135" text-anchor="middle" fill="#d1fae5" font-family="monospace" font-size="10">Query → Vector</text>

  <!-- Vector Search -->
  <path d="M420 120 L465 120" stroke="url(#ragGrad)" stroke-width="3" fill="none"/>
  <rect x="470" y="80" width="180" height="80" rx="12" fill="#78350f" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="110" text-anchor="middle" fill="#fcd34d" font-family="system-ui" font-size="13" font-weight="600">Vector Store</text>
  <text x="560" y="135" text-anchor="middle" fill="#fef3c7" font-family="monospace" font-size="10">similaritySearch</text>

  <!-- Retrieved Docs -->
  <path d="M655 120 L700 120" stroke="url(#ragGrad)" stroke-width="3" fill="none"/>
  <rect x="705" y="80" width="80" height="80" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="745" y="105" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">Docs</text>
  <text x="745" y="125" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">Retrieved</text>

  <!-- Prompt Augmentation -->
  <path d="M790 120 L740 120" stroke="#06b6d4" stroke-width="3" fill="none" stroke-dasharray="5,5"/>
  <rect x="20" y="200" width="760" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="400" y="230" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="13" font-weight="600">Prompt Augmentation</text>
  <text x="400" y="260" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="11">Context + Question → Augmented Prompt</text>

  <!-- LLM -->
  <path d="M400 285 L400 330" stroke="url(#ragGrad)" stroke-width="3" fill="none"/>
  <rect x="250" y="335" width="300" height="55" rx="12" fill="#134e4a" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="358" text-anchor="middle" fill="#6ee7b7" font-family="system-ui" font-size="13" font-weight="600">ChatClient.generate</text>
  <text x="400" y="378" text-anchor="middle" fill="#d1fae5" font-family="monospace" font-size="10">Retrieval Augmented Generation</text>

  <!-- Labels -->
  <text x="100" y="395" text-anchor="middle" fill="#10b981" font-family="system-ui" font-size="10" font-weight="600">INVOKE</text>
  <text x="325" y="395" text-anchor="middle" fill="#10b981" font-family="system-ui" font-size="10" font-weight="600">TRANSFORM</text>
  <text x="560" y="395" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="10" font-weight="600">RETRIEVE</text>
  <text x="400" y="395" text-anchor="middle" fill="#06b6d4" font-family="system-ui" font-size="10" font-weight="600">GENERATE</text>
</svg>