<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="springGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e6edf3" font-family="system-ui" font-size="18" font-weight="600">Spring AI Architecture</text>

  <!-- Your App Box -->
  <rect x="40" y="80" width="200" height="120" rx="12" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="115" text-anchor="middle" fill="#93c5fd" font-family="system-ui" font-size="13" font-weight="600">Your Application</text>
  <rect x="60" y="130" width="160" height="50" rx="8" fill="#1e40af" fill-opacity="0.5"/>
  <text x="140" y="160" text-anchor="middle" fill="#e0f2fe" font-family="monospace" font-size="12">ChatClient</text>

  <!-- Arrow 1 -->
  <path d="M245 140 L295 140" stroke="url(#springGrad)" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/></marker></defs>
  <text x="270" y="125" text-anchor="middle" fill="#10b981" font-family="system-ui" font-size="11">prompt()</text>

  <!-- Spring AI Box -->
  <rect x="300" y="80" width="200" height="120" rx="12" fill="#134e4a" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="115" text-anchor="middle" fill="#6ee7b7" font-family="system-ui" font-size="13" font-weight="600">Spring AI</text>
  <rect x="320" y="130" width="160" height="50" rx="8" fill="#065f46" fill-opacity="0.5"/>
  <text x="400" y="160" text-anchor="middle" fill="#d1fae5" font-family="monospace" font-size="12">ChatModel</text>

  <!-- Arrow 2 -->
  <path d="M505 140 L555 140" stroke="url(#springGrad)" stroke-width="3" fill="none" marker-end="url(#arrowhead2)"/>
  <defs><marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/></marker></defs>
  <text x="530" y="125" text-anchor="middle" fill="#10b981" font-family="system-ui" font-size="11">API Call</text>

  <!-- LLM Provider Box -->
  <rect x="560" y="80" width="200" height="120" rx="12" fill="#78350f" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="115" text-anchor="middle" fill="#fcd34d" font-family="system-ui" font-size="13" font-weight="600">LLM Provider</text>
  <rect x="580" y="130" width="160" height="50" rx="8" fill="#92400e" fill-opacity="0.5"/>
  <text x="660" y="155" text-anchor="middle" fill="#fef3c7" font-family="monospace" font-size="11">OpenAI / OpenRouter</text>
  <text x="660" y="172" text-anchor="middle" fill="#fcd34d" font-family="monospace" font-size="10">Anthropic / Azure</text>

  <!-- Response Flow -->
  <path d="M660 205 L660 250 L140 250 L140 220" stroke="#06b6d4" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead3)"/>
  <defs><marker id="arrowhead3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#06b6d4"/></marker></defs>
  <text x="400" y="270" text-anchor="middle" fill="#06b6d4" font-family="system-ui" font-size="12">Response flows back through ChatClient</text>

  <!-- Bottom Info -->
  <rect x="100" y="310" width="600" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="400" y="340" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="12">Key Concepts:</text>
  <text x="200" y="365" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="11">• ChatClient is immutable</text>
  <text x="400" y="365" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="11">• Builder pattern for configuration</text>
  <text x="600" y="365" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="11">• Portable across providers</text>
</svg>