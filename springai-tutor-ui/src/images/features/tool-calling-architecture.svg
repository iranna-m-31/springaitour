<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="#0d1117"/>
  <text x="400" y="40" text-anchor="middle" fill="#e6edf3" font-family="system-ui" font-size="18" font-weight="600">Tool Calling Flow</text>

  <!-- User -->
  <rect x="50" y="80" width="120" height="100" rx="12" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="115" text-anchor="middle" fill="#93c5fd" font-family="system-ui" font-size="12">User</text>
  <text x="110" y="135" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="9">"What time is it?"</text>

  <!-- ChatClient -->
  <path d="M175 130 L225 130" stroke="url(#toolGrad)" stroke-width="3" fill="none"/>
  <rect x="230" y="80" width="180" height="120" rx="12" fill="#134e4a" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="115" text-anchor="middle" fill="#6ee7b7" font-family="system-ui" font-size="13" font-weight="600">ChatClient</text>
  <text x="320" y="140" text-anchor="middle" fill="#d1fae5" font-family="monospace" font-size="10">Tools Enabled</text>

  <!-- Tool Calling Advisor -->
  <path d="M415 140 L465 140" stroke="url(#toolGrad)" stroke-width="3" fill="none"/>
  <rect x="470" y="80" width="160" height="120" rx="12" fill="#78350f" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="115" text-anchor="middle" fill="#fcd34d" font-family="system-ui" font-size="13" font-weight="600">ToolCallingAdvisor</text>
  <text x="550" y="135" text-anchor="middle" fill="#fef3c7" font-family="monospace" font-size="9">Orchestrates loop</text>

  <!-- Tool Execution -->
  <path d="M635 140 L685 140" stroke="url(#toolGrad)" stroke-width="3" fill="none"/>
  <rect x="690" y="80" width="180" height="120" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="115" text-anchor="end" fill="#94a3b8" font-family="system-ui" font-size="12">Your Tools</text>
  <text x="780" y="135" text-anchor="end" fill="#64748b" font-family="monospace" font-size="9">DateTimeTools</text>

  <!-- Tool Result -->
  <path d="M875 140 L875 190 L230 190 L230 160" stroke="#06b6d4" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#06b6d4"/></marker></defs>

  <!-- Final Answer -->
  <rect x="50" y="200" width="700" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="400" y="235" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="13" font-weight="600">Tool Calling Loop</text>
  <text x="400" y="265" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="11">User → LLM → Tool → LLM → User</text>

  <!-- Example Flow -->
  <text x="400" y="295" text-anchor="middle" fill="#60a5fa" font-family="system-ui" font-size="12">Example Steps:</text>
  <text x="150" y="320" text-anchor="start" fill="#e6edf3" font-family="monospace" font-size="10">1. User asks: "What time is it?"</text>
  <text x="150" y="340" text-anchor="start" fill="#e6edf3" font-family="monospace" font-size="10">2. LLM sees @Tool annotation, calls now()</text>
  <text x="150" y="360" text-anchor="start" fill="#e6edf3" font-family="monospace" font-size="10">3. Tool returns current time</text>
  <text x="150" y="380" text-anchor="start" fill="#e6edf3" font-family="monospace" font-size="10">4. LLM formats answer, returns to user</text>

  <!-- Bottom Summary -->
  <rect x="50" y="330" width="700" height="50" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="400" y="355" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">Key: @Tool + @ToolParam + ToolCallingAdvisor = Automatic tool loop</text>

  <!-- Labels -->
  <text x="110" y="395" text-anchor="middle" fill="#10b981" font-family="system-ui" font-size="10" font-weight="600">INVOKE</text>
  <text x="320" y="395" text-anchor="middle" fill="#10b981" font-family="system-ui" font-size="10" font-weight="600">DETECT</text>
  <text x="550" y="395" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="10" font-weight="600">EXECUTE</text>
  <text x="780" y="395" text-anchor="end" fill="#06b6d4" font-family="system-ui" font-size="10" font-weight="600">RETURN</text>
</svg>