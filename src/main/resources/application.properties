spring.application.name=spring-ai-tutor
server.port=${SERVER_PORT:8080}

# Load .env file for API key configuration
spring.config.import=optional:.env

# API key may be blank — the app still boots. /api/tutor/health reports
# apiKeyConfigured=false so the UI shows a setup banner instead of 401s.
spring.ai.openai.api-key=${OPENROUTER_API_KEY:}
spring.ai.openai.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
spring.ai.openai.chat.options.model=${OPENROUTER_CHAT_MODEL:nvidia/nemotron-3-embed-1b:free}

# Embedding defaults to a free OpenRouter model; override if you have OpenAI direct.
spring.ai.openai.embedding.options.model=${OPENROUTER_EMBEDDING_MODEL:nvidia/nemotron-3-embed-1b:free}
spring.ai.openai.embedding.options.encoding-format=float

tutor.strict-model=${OPENROUTER_STRICT_MODEL:openai/gpt-4o-mini}
tutor.vector-store=${VECTOR_STORE:simple}
tutor.moderation-enabled=${MODERATION_ENABLED:false}

logging.level.org.springframework.ai.chat.client.advisor=DEBUG

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.ai-metrics.enabled=true

# CORS for Vercel frontend calling local/hosted Spring Boot
# For development with Vercel preview deployments
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=false
