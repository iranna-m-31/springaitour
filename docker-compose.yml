version: '3.8'

services:
  spring-ai:
    build:
      context: ./spring-ai
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - PORT=8080
    volumes:
      - ./spring-ai:/app
      - ~/.gradle:/root/.gradle
    networks:
      - spring-ai-network

  spring-ai-ui:
    build:
      context: ./spring-ai-ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://spring-ai:8080
    depends_on:
      - spring-ai
    networks:
      - spring-ai-network

networks:
  spring-ai-network:
    driver: bridge
